{% extends "base.html" %}
{% block content %}

<div class="login-container">
    <div class="login-box">
        <div class="login-logo">Cond<span>286</span></div>
        <p class="login-subtitle">Gestão do Condomínio</p>
        
        <form method="POST">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input class="form-input" type="email" id="email" name="email" required placeholder="admin@cond286.pt">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Palavra-passe</label>
                <input class="form-input" type="password" id="password" name="password" required placeholder="········">
            </div>
            <button type="submit" class="btn btn-primary btn-block">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Entrar
            </button>
        </form>
    </div>
</div>

{% endblock %}
