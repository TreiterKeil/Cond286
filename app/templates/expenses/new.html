{% extends "base.html" %}
{% block content %}

<a href="{{ url_for('expenses.list') }}" class="back-link">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Despesas
</a>

<h1>Nova Despesa</h1>

<div class="card" style="margin-top: 12px;">
<form method="POST">
    
    <div class="form-group">
        <label class="form-label" for="categoria">Categoria</label>
        <select class="form-select" id="categoria" name="categoria" required>
            <option value="">— Selecionar categoria —</option>
            {% for cat in categorias %}
            <option value="{{ cat }}">{{ cat }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label class="form-label" for="descricao">Descrição</label>
        <input class="form-input" type="text" id="descricao" name="descricao" required placeholder="Ex: Limpeza das escadas — Março">
    </div>

    <div class="form-group">
        <label class="form-label" for="valor">Valor (€)</label>
        <input class="form-input text-mono" type="number" id="valor" name="valor" step="0.01" min="0.01" required placeholder="Ex: 80.00">
        <div class="quick-values">
            <a href="#" onclick="document.getElementById('valor').value='6.73'; return false;">6,73€</a>
            <a href="#" onclick="document.getElementById('valor').value='8.32'; return false;">8,32€</a>
            <a href="#" onclick="document.getElementById('valor').value='16.50'; return false;">16,50€</a>
            <a href="#" onclick="document.getElementById('valor').value='20.93'; return false;">20,93€</a>
            <a href="#" onclick="document.getElementById('valor').value='80'; return false;">80€</a>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label" for="data">Data da Despesa</label>
        <input class="form-input" type="date" id="data" name="data" required value="{{ today.strftime('%Y-%m-%d') if today else '' }}">
    </div>

    <div class="form-group">
        <label class="form-label" for="metodo_pagamento">Método de Pagamento</label>
        <select class="form-select" id="metodo_pagamento" name="metodo_pagamento">
            <option value="">— Selecionar —</option>
            <option value="Conta Bancária Condomínio">Conta Bancária Condomínio</option>
            <option value="Dinheiro (Fundo de Maneio)">Dinheiro (Fundo de Maneio)</option>
            <option value="Débito Direto">Débito Direto</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-label" for="pago_por">Pago por</label>
        <select class="form-select" id="pago_por" name="pago_por">
            <option value="">— Selecionar —</option>
            <option value="Conta Condomínio">Conta Condomínio</option>
            <option value="Administrador (pessoal)">Administrador (pessoal — a reembolsar)</option>
        </select>
        <div class="form-hint">Se pago pelo administrador, ficará marcado como pendente de reembolso.</div>
    </div>

    <div class="form-group">
        <label class="form-label" for="notas">Notas (opcional)</label>
        <textarea class="form-textarea" id="notas" name="notas" rows="2" placeholder="Ex: Pago com cartão pessoal."></textarea>
    </div>

    <button type="submit" class="btn btn-danger btn-block btn-lg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/></svg>
        Registar Despesa
    </button>

</form>
</div>

{% endblock %}
