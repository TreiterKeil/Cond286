{% extends "base.html" %}
{% block content %}

<a href="{{ url_for('announcements.index') }}" class="back-link">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Comunicados
</a>

<article class="card" style="margin-top: 12px;">
    <h1 style="margin-bottom: 4px;">{{ anuncio.titulo }}</h1>
    <p class="text-muted" style="font-size: 0.8em; margin-bottom: 18px;">
        {{ anuncio.criado_em.strftime('%d de %B de %Y às %H:%M') }}
    </p>
    
    {% if anuncio.anexo_path %}
    <div class="card" style="background: var(--surface-alt); margin-bottom: 16px; padding: 10px 14px;">
        <span class="text-muted" style="font-size: 0.82em;">📎 Anexo: {{ anuncio.anexo_path }}</span>
    </div>
    {% endif %}
    
    <div style="line-height: 1.7; font-size: 0.94em; white-space: pre-line;">
        {{ anuncio.conteudo }}
    </div>

    {% if current_user.is_admin() %}
    <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-light);">
        <form method="POST" action="{{ url_for('announcements.delete', id=anuncio.id) }}" onsubmit="return confirm('Eliminar este comunicado permanentemente?')">
            <button type="submit" class="btn btn-danger btn-sm">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
                Eliminar
            </button>
        </form>
    </div>
    {% endif %}
</article>

{% endblock %}
