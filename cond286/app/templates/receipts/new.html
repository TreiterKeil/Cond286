{% extends "base.html" %}
{% block content %}

<a href="{{ url_for('receipts.list') }}" class="back-link">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Recibos
</a>

<h1>Novo Recibo</h1>

<div class="card" style="margin-top: 12px;">
<form method="POST">
    
    <div class="form-group">
        <label class="form-label" for="unidade_id">Fração</label>
        <select class="form-select" id="unidade_id" name="unidade_id" required>
            <option value="">— Selecionar fração —</option>
            {% for unidade in unidades %}
            <option value="{{ unidade.id }}">
                {{ unidade.codigo }} — {{ unidade.nome_proprietario[:35] if unidade.nome_proprietario else 'Sem nome' }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label class="form-label" for="valor">Valor (€)</label>
        <input class="form-input text-mono" type="number" id="valor" name="valor" step="0.01" min="0.01" required placeholder="Ex: 90.00">
        <div class="quick-values">
            <a href="#" onclick="document.getElementById('valor').value='15'; return false;">15€</a>
            <a href="#" onclick="document.getElementById('valor').value='30'; return false;">30€</a>
            <a href="#" onclick="document.getElementById('valor').value='45'; return false;">45€</a>
            <a href="#" onclick="document.getElementById('valor').value='90'; return false;">90€</a>
            <a href="#" onclick="document.getElementById('valor').value='180'; return false;">180€</a>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Período a que se refere</label>
        <div class="form-row">
            <div>
                <label class="form-label" for="periodo_inicio" style="font-size: 0.75em;">Início</label>
                <input class="form-input" type="date" id="periodo_inicio" name="periodo_inicio" required>
            </div>
            <div>
                <label class="form-label" for="periodo_fim" style="font-size: 0.75em;">Fim</label>
                <input class="form-input" type="date" id="periodo_fim" name="periodo_fim" required>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label" for="metodo_pagamento">Método de Pagamento</label>
        <select class="form-select" id="metodo_pagamento" name="metodo_pagamento">
            <option value="">— Selecionar —</option>
            <option value="Transferência Bancária">Transferência Bancária</option>
            <option value="MBWay">MBWay</option>
            <option value="Dinheiro">Dinheiro</option>
            <option value="Fundo de Maneio">Fundo de Maneio</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-label" for="data_recebido">Data de Recebimento</label>
        <input class="form-input" type="date" id="data_recebido" name="data_recebido" required value="{{ today.strftime('%Y-%m-%d') if today else '' }}">
    </div>

    <div class="form-group">
        <label class="form-label" for="notas">Notas (opcional)</label>
        <textarea class="form-textarea" id="notas" name="notas" rows="2" placeholder="Ex: Pagamento referente a quotas em atraso..."></textarea>
    </div>

    <button type="submit" class="btn btn-success btn-block btn-lg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
        Emitir Recibo
    </button>

</form>
</div>

{% endblock %}
