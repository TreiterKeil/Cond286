{% extends "base.html" %}
{% block content %}

<a href="{{ url_for('petty_cash.index') }}" class="back-link">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Fundo de Maneio
</a>

<h1>Novo Movimento</h1>

<div class="card" style="margin-top: 12px;">
<form method="POST">
    
    <div class="form-group">
        <label class="form-label" for="tipo">Tipo de Movimento</label>
        <select class="form-select" id="tipo" name="tipo" required>
            <option value="">— Selecionar —</option>
            <option value="levantamento">🏧 Levantamento (dinheiro entra no fundo)</option>
            <option value="despesa">💰 Despesa (dinheiro sai do fundo)</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-label" for="valor">Valor (€)</label>
        <input class="form-input text-mono" type="number" id="valor" name="valor" step="0.01" min="0.01" required placeholder="Ex: 80.00">
        <div class="quick-values">
            <a href="#" onclick="document.getElementById('valor').value='80'; return false;">80€</a>
            <a href="#" onclick="document.getElementById('valor').value='160'; return false;">160€</a>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label" for="descricao">Descrição</label>
        <input class="form-input" type="text" id="descricao" name="descricao" required placeholder="Ex: Limpeza das escadas — Março 2026">
    </div>

    <div class="form-group">
        <label class="form-label" for="data">Data</label>
        <input class="form-input" type="date" id="data" name="data" required value="{{ today.strftime('%Y-%m-%d') if today else '' }}">
    </div>

    <button type="submit" class="btn btn-warning btn-block btn-lg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/></svg>
        Registar Movimento
    </button>

</form>
</div>

{% endblock %}
